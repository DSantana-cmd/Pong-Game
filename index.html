<!DOCTYPE html>
<html>
<head>
  <title>Pong Game</title>
  <style>
    canvas { background: black; display: block; margin: auto; }
  </style>
</head>
<body>

<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let paddleHeight = 80, paddleWidth = 10;
let playerY = canvas.height / 2 - paddleHeight / 2;
let aiY = playerY;

let ballX = canvas.width / 2;
let ballY = canvas.height / 2;
let ballSpeedX = 4;
let ballSpeedY = 4;

document.addEventListener("mousemove", e => {
  playerY = e.clientY - canvas.offsetTop - paddleHeight / 2;
});

function drawRect(x, y, w, h) {
  ctx.fillStyle = "white";
  ctx.fillRect(x, y, w, h);
}

function drawBall(x, y, r) {
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function update() {
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY < 0 || ballY > canvas.height) ballSpeedY *= -1;

  aiY += (ballY - (aiY + paddleHeight/2)) * 0.1;

  if (ballX < 20 && ballY > playerY && ballY < playerY + paddleHeight) {
    ballSpeedX *= -1;
  }

  if (ballX > canvas.width - 20 && ballY > aiY && ballY < aiY + paddleHeight) {
    ballSpeedX *= -1;
  }

  if (ballX < 0 || ballX > canvas.width) {
    ballX = canvas.width / 2;
    ballY = canvas.height / 2;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(10, playerY, paddleWidth, paddleHeight);
  drawRect(canvas.width - 20, aiY, paddleWidth, paddleHeight);
  drawBall(ballX, ballY, 8);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
