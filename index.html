<!DOCTYPE html>
<html>
<head>
  <title>Pro Pong Game</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #2b004f, #00bcd4);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 25px;
      color: #f5e8ff;
      text-shadow: 0 0 12px #c77dff;
    }

    p {
      color: #e0f7ff;
    }

    canvas {
      background: #090014;
      border: 4px solid #c77dff;
      box-shadow: 0 0 25px #00e5ff, 0 0 35px #c77dff;
      border-radius: 15px;
      display: block;
      margin: 20px auto;
    }
  </style>
</head>
<body>

<h1>💜 Coral Blue Pong 🏓</h1>
<p>Move your mouse up and down to play</p>

<canvas id="game" width="700" height="430"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let paddleHeight = 90, paddleWidth = 14;
let playerY = canvas.height / 2 - paddleHeight / 2;
let aiY = playerY;

let ballX = canvas.width / 2;
let ballY = canvas.height / 2;
let ballSpeedX = 5;
let ballSpeedY = 4;

let playerScore = 0;
let aiScore = 0;

document.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  playerY = e.clientY - rect.top - paddleHeight / 2;
});

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawBall(x, y, r) {
  ctx.fillStyle = "#00e5ff";
  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawNet() {
  for (let i = 0; i < canvas.height; i += 30) {
    drawRect(canvas.width / 2 - 2, i, 4, 16, "#8a2be2");
  }
}

function drawScore() {
  ctx.fillStyle = "white";
  ctx.font = "34px Arial";
  ctx.fillText(playerScore, canvas.width / 2 - 70, 45);
  ctx.fillText(aiScore, canvas.width / 2 + 50, 45);
}

function resetBall() {
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  ballSpeedX *= -1;
}

function update() {
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY < 0 || ballY > canvas.height) ballSpeedY *= -1;

  aiY += (ballY - (aiY + paddleHeight / 2)) * 0.08;

  if (ballX < 30 && ballY > playerY && ballY < playerY + paddleHeight) {
    ballSpeedX *= -1;
  }

  if (ballX > canvas.width - 30 && ballY > aiY && ballY < aiY + paddleHeight) {
    ballSpeedX *= -1;
  }

  if (ballX < 0) {
    aiScore++;
    resetBall();
  }

  if (ballX > canvas.width) {
    playerScore++;
    resetBall();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawNet();
  drawScore();

  drawRect(15, playerY, paddleWidth, paddleHeight, "#c77dff");
  drawRect(canvas.width - 30, aiY, paddleWidth, paddleHeight, "#00e5ff");
  drawBall(ballX, ballY, 9);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
